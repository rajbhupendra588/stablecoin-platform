spring:
  application:
    name: risk-engine
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/stablecoin}
    username: ${JDBC_USERNAME:stablecoin}
    password: ${JDBC_PASSWORD:stablecoin}
  flyway:
    enabled: true
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
