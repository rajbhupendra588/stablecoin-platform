services:
  postgres:
    image: postgres:16-alpine
    container_name: stablecoin-postgres
    environment:
      POSTGRES_DB: stablecoin
      POSTGRES_USER: stablecoin
      POSTGRES_PASSWORD: stablecoin
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stablecoin -d stablecoin"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: stablecoin-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: stablecoin-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: stablecoin-kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stablecoin-kafka-ui
    depends_on: [kafka]
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: stablecoin-prometheus
    ports: ["9090:9090"]
    volumes: ["./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:11.1.4
    container_name: stablecoin-grafana
    ports: ["3000:3000"]
  zipkin:
    image: openzipkin/zipkin:3
    container_name: stablecoin-zipkin
    ports: ["9411:9411"]
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: stablecoin-mailhog
    ports: ["1025:1025", "8025:8025"]
volumes:
  postgres_data:
